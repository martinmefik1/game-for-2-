<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>СЛЕДСТВИЕ 2007 — 3D Detective</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{font-family:Georgia,serif;background:#050805;color:#e8e2d4;overflow:hidden;height:100vh;width:100vw}
#app{position:fixed;inset:0;z-index:1}
canvas{display:block}

/* HUD */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
#hud.on{display:block}
.hud-panel{background:rgba(5,10,5,0.94);border:1px solid rgba(201,162,39,0.4);
  padding:12px 18px;border-radius:3px;box-shadow:0 10px 30px rgba(0,0,0,0.8);pointer-events:auto}
#case-info{position:absolute;top:20px;left:20px;max-width:340px}
#case-info h1{font-size:10px;letter-spacing:0.25em;color:#c9a227;text-transform:uppercase;margin-bottom:6px}
#case-info .num{font-size:22px;color:#e8e2d4}
#case-info .desc{font-size:12px;color:#8a8272;font-style:italic;margin-top:4px}
#ev-panel{position:absolute;top:20px;right:20px;width:280px}
#ev-panel h2{font-size:10px;letter-spacing:0.22em;color:#c9a227;text-transform:uppercase;margin-bottom:10px}
#evlist{max-height:340px;overflow-y:auto}
.ev-item{font-size:12px;padding:5px 0;border-bottom:1px dashed rgba(201,162,39,0.2);display:flex;gap:6px}
.ev-item .dot{color:#c9a227;font-size:9px;margin-top:3px}
.ev-empty{font-size:11px;color:#555;font-style:italic;padding:10px 0}

#crosshair{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;
  background:#c9a227;border-radius:50%;z-index:5;pointer-events:none;display:none;
  box-shadow:0 0 8px rgba(201,162,39,0.8)}
#crosshair.on{display:block}

#prompt{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);
  padding:10px 26px;background:rgba(5,10,5,0.95);border:1px solid #c9a227;
  color:#e8c96b;font-size:14px;letter-spacing:0.06em;border-radius:2px;
  z-index:20;opacity:0;transition:0.2s;pointer-events:none;white-space:nowrap}
#prompt.on{opacity:1}

#toolbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  display:flex;gap:10px;z-index:20;background:rgba(5,10,5,0.94);
  padding:10px 14px;border-radius:4px;border:1px solid rgba(201,162,39,0.4);display:none}
#toolbar.on{display:flex}
.tool{width:66px;height:66px;border:1px solid rgba(201,162,39,0.25);border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;background:rgba(0,0,0,0.4);transition:0.15s;color:#8a8272;position:relative}
.tool:hover{border-color:#c9a227;color:#e8e2d4}
.tool.active{border-color:#c9a227;background:rgba(201,162,39,0.18);color:#e8c96b;
  box-shadow:0 0 18px rgba(201,162,39,0.4)}
.tool .ico{font-size:26px;line-height:1}
.tool .lbl{font-size:8px;letter-spacing:0.1em;margin-top:4px;text-transform:uppercase}
.tool .k{position:absolute;top:3px;right:5px;font-size:9px;color:#c9a227}

#room-label{position:fixed;top:20px;left:50%;transform:translateX(-50%);
  padding:8px 24px;background:rgba(5,10,5,0.9);border:1px solid rgba(201,162,39,0.3);
  color:#e8c96b;font-size:12px;letter-spacing:0.3em;text-transform:uppercase;
  z-index:15;opacity:0;transition:0.5s;pointer-events:none}
#room-label.on{opacity:1}

/* Screens */
.screen{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at center,#1a1f1a 0%,#050805 100%);
  display:none;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:40px 20px;overflow-y:auto}
.screen.on{display:flex}
.screen h1{font-size:44px;letter-spacing:0.1em;color:#e8c96b;
  text-shadow:0 0 40px rgba(201,162,39,0.4);margin-bottom:8px;text-align:center;font-weight:400}
.screen .subtitle{font-size:14px;color:#8a8272;font-style:italic;
  margin-bottom:30px;text-align:center;letter-spacing:0.06em}

.btn{display:inline-block;padding:13px 34px;margin:6px;border:1px solid #c9a227;
  background:transparent;color:#e8c96b;font-family:inherit;font-size:12px;
  letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;transition:0.2s;border-radius:2px}
.btn:hover{background:#c9a227;color:#050805;box-shadow:0 0 24px rgba(201,162,39,0.4)}
.btn:disabled{opacity:0.3;cursor:not-allowed;box-shadow:none;background:transparent}
.btn.gold{background:linear-gradient(180deg,#d4ae35,#8b7019);color:#050805;border-color:#d4ae35;font-weight:700}
.btn.gold:hover{box-shadow:0 0 30px rgba(201,162,39,0.6)}

/* Case selection */
#cases-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:18px;max-width:1200px;width:100%}
.case-card{background:linear-gradient(180deg,rgba(20,25,20,0.95),rgba(10,15,10,0.95));
  border:1px solid rgba(201,162,39,0.3);padding:22px;border-radius:4px;
  cursor:pointer;transition:0.25s;position:relative;overflow:hidden}
.case-card:hover{border-color:#c9a227;transform:translateY(-4px);
  box-shadow:0 15px 40px rgba(0,0,0,0.8),0 0 30px rgba(201,162,39,0.2)}
.case-card .year{font-size:11px;color:#c9a227;letter-spacing:0.28em;text-transform:uppercase;margin-bottom:8px}
.case-card h3{font-size:20px;color:#e8e2d4;margin-bottom:10px;font-weight:400}
.case-card p{font-size:13px;color:#8a8272;line-height:1.55}
.case-card .badge{position:absolute;top:12px;right:12px;border:1px solid #8b1e1e;
  color:#c05050;padding:2px 9px;font-size:9px;letter-spacing:0.18em;transform:rotate(4deg)}
.case-card .difficulty{margin-top:12px;font-size:11px;color:#8a8272}
.case-card .difficulty b{color:#e8c96b;font-weight:400}

/* Cutscene */
#cutscene{position:fixed;inset:0;z-index:200;background:#000;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.8s}
#cutscene.on{opacity:1;pointer-events:auto}
#cutscene .year{font-size:13px;letter-spacing:0.5em;color:#c9a227;margin-bottom:26px}
#cutscene .text{font-size:26px;color:#e8e2d4;text-align:center;max-width:800px;
  line-height:1.5;font-style:italic;white-space:pre-line}
#cutscene .sub{font-size:12px;color:#8a8272;margin-top:26px;letter-spacing:0.15em;text-transform:uppercase}

/* Interrogation */
.inter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px;max-width:1100px;width:100%;margin-top:16px}
.sus-card{background:rgba(5,10,5,0.94);border:1px solid rgba(201,162,39,0.3);
  padding:22px;cursor:pointer;transition:0.2s;border-radius:3px}
.sus-card:hover{border-color:#c9a227;background:rgba(201,162,39,0.06)}
.sus-card.selected{border-color:#c9a227;background:rgba(201,162,39,0.14)}
.sus-card .name{font-size:18px;color:#e8e2d4;margin-bottom:4px}
.sus-card .role{font-size:11px;color:#8a8272;font-style:italic;margin-bottom:14px}
.sus-card .alibi{font-size:13px;color:#cfc6b2;line-height:1.5;
  border-left:2px solid #c9a227;padding-left:12px}
.sus-card .status{margin-top:12px;font-size:10px;letter-spacing:0.16em;text-transform:uppercase}
.sus-card .status.conf{color:#e8c96b;font-weight:700}
.sus-card .status.ok{color:#7a9a6a}
.sus-card .status.denied{color:#c07070}

.dossier{max-width:900px;width:100%;margin-top:18px;background:rgba(5,10,5,0.96);
  border:1px solid #c9a227;padding:24px;border-radius:3px;display:none}
.dossier.on{display:block}
.dossier h3{font-size:12px;letter-spacing:0.22em;color:#e8c96b;
  text-transform:uppercase;margin-bottom:16px;font-weight:400}
.dossier-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.dossier-actions .btn{font-size:10px;padding:9px 16px;margin:0}
.dialog{max-height:280px;overflow-y:auto;margin-bottom:16px}
.qa{margin-bottom:14px}
.q{color:#c9a227;font-size:11px;letter-spacing:0.1em;margin-bottom:5px;text-transform:uppercase}
.a{color:#cfc6b2;font-size:14px;line-height:1.6;
  border-left:2px solid rgba(201,162,39,0.4);padding-left:14px}
.a.lie{color:#e0b0b0}

/* Court */
#court-grid,#court-ev-grid{display:flex;flex-wrap:wrap;gap:12px;
  justify-content:center;margin-top:12px;max-width:1000px}
.court-item{padding:14px 22px;border:1px solid rgba(201,162,39,0.3);border-radius:2px;
  background:rgba(0,0,0,0.4);cursor:pointer;transition:0.15s;font-size:13px;color:#cfc6b2}
.court-item:hover{border-color:#c9a227;background:rgba(201,162,39,0.08)}
.court-item.sel{border-color:#c9a227;background:rgba(201,162,39,0.2);color:#e8c96b;
  box-shadow:0 0 20px rgba(201,162,39,0.4)}
.court-section{max-width:900px;width:100%;margin-top:24px;text-align:center}
.court-section h2{font-size:11px;letter-spacing:0.25em;color:#c9a227;
  text-transform:uppercase;margin-bottom:14px}

/* Verdict */
.verdict-box{max-width:800px;background:rgba(5,10,5,0.96);border:1px solid #c9a227;
  padding:36px;border-radius:4px;line-height:1.8;margin-top:20px}
.verdict-box h2{color:#e8c96b;font-size:26px;margin-bottom:18px;font-weight:400}
.verdict-box p{color:#e8e2d4;font-size:15px;margin-bottom:14px}
.verdict-box .history{margin-top:26px;padding-top:20px;
  border-top:1px solid rgba(201,162,39,0.3);font-style:italic;
  color:#a89f8d;font-size:13px;line-height:1.7}
.verdict-box .history strong{color:#c9a227;font-style:normal;display:block;margin-bottom:8px;
  font-size:11px;letter-spacing:0.2em;text-transform:uppercase}

/* Click to play overlay */
#click-start{position:fixed;inset:0;z-index:50;background:rgba(5,10,5,0.85);
  display:none;align-items:center;justify-content:center;
  font-size:18px;color:#e8c96b;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer}
#click-start.on{display:flex}

#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);
  padding:12px 26px;background:rgba(5,10,5,0.96);border:1px solid #c9a227;
  color:#e8c96b;font-size:14px;letter-spacing:0.06em;text-align:center;
  border-radius:2px;opacity:0;transition:0.3s;pointer-events:none;z-index:70;max-width:70%}
#toast.on{opacity:1}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:rgba(0,0,0,0.4)}
::-webkit-scrollbar-thumb{background:rgba(201,162,39,0.4);border-radius:4px}
</style>
</head>

</div>

function generateFictionalCase() {
  const names = ['Виктор','Аркадий','Геннадий','Николай','Борис','Лев','Анатолий','Сергей','Олег'];
  const namesF = ['Валентина','Людмила','Зоя','Тамара','Раиса','Нина','Галина'];
  const sur = ['Кузнецов','Соловьёв','Дроздов','Ковалёв','Барсуков','Ерохин','Лебедев','Тихонов','Скворцов','Мельников'];
  const num = 100 + ((Math.random()*900)|0);
  const victimName = (Math.random()<0.5?rnd(names):rnd(namesF)) + ' ' + rnd(sur);
  const victimAge = 25 + ((Math.random()*40)|0);
  const occ = rnd(['банкир','предприниматель','чиновник','журналист','инженер','врач','нотариус']);
  const means = rnd(['Пистолет','Кухонный нож','Удавка','Яд','Молоток']);
  const roomSet = pick(ROOMS_ALL, 4);
  
  const suspects = [];
  const usedNames = new Set();
  for (let i = 0; i < 3; i++) {
    let name;
    do { name = (Math.random()<0.5?rnd(names):rnd(namesF)) + ' ' + rnd(sur); } while (usedNames.has(name));
    usedNames.add(name);
    suspects.push({
      name,
      role: rnd(['Знакомый','Коллега','Сосед','Партнёр','Родственник']),
      alibi: rnd(['Был на работе','Смотрел телевизор','Гулял в парке','Был в командировке','Спал дома','Был в баре']),
      culprit: false
    });
  }
  const culpritIdx = (Math.random()*3)|0;
  suspects[culpritIdx].culprit = true;
  
  const evTypes = [
    { name:'Отпечаток', tool:'magnifier' },
    { name:'Волос', tool:'magnifier' },
    { name:'Пятно крови', tool:'uv' },
    { name:'Документ', tool:'eyes' },
    { name:'Телефон', tool:'eyes' },
    { name:'Записка', tool:'eyes' }
  ];
  const evidence = [];
  const evCount = 6 + ((Math.random()*3)|0);
  const chosenTypes = pick(evTypes, Math.min(evCount, evTypes.length));
  for (let i = 0; i < evCount; i++) {
    const t = i < chosenTypes.length ? chosenTypes[i] : rnd(evTypes);
    const room = roomSet[i % roomSet.length];
    const linksTo = Math.random() < 0.85 ? (Math.random()*3)|0 : null;
    evidence.push({
      id: 'e' + i,
      name: t.name,
      tool: t.tool,
      room,
      pos: [ (Math.random()-0.5)*4, 0.02 + Math.random()*0.8, -1 - Math.random()*4 ],
      desc: `${t.name}. Связывает подозреваемого.`,
      linksTo
    });
  }
  
  return {
    id: 'f' + num, year: 2007,
    title: 'Убийство ' + victimName,
    subtitle: `Жертва — ${victimName}, ${victimAge} лет`,
    badge: 'СГЕНЕРИРОВАНО',
    desc: `Дело № ${num}. ${occ[0].toUpperCase()+occ.slice(1)} найден убитым в собственной квартире. Орудие — ${means.toLowerCase()}.`,
    history: null,
    time: Math.random()<0.5?'day':'night',
    victim: `${victimName}, ${victimAge} лет`,
    means,
    rooms: roomSet,
    evidence,
    suspects
  };
}

function texNoise(color, size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = color;
  g.fillRect(0, 0, size, size);
  const img = g.getImageData(0, 0, size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random()-0.5) * 28;
    img.data[i] = Math.max(0, Math.min(255, img.data[i] + n));
    img.data[i+1] = Math.max(0, Math.min(255, img.data[i+1] + n));
    img.data[i+2] = Math.max(0, Math.min(255, img.data[i+2] + n));
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function canMoveTo(x, z) {
  const r = 0.28;
  if (x < -8.2 + r || x > 8.2 - r || z < -9.2 + r || z > 9.2 - r) return false;
  for (const w of WALLS) {
    if (x + r > w.x1 && x - r < w.x2 && z + r > w.z1 && z - r < w.z2) return false;
  }
  return true;
}

  return 'Прихожая';
}

function buildApartment() {
  // Очистка
  world.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material.dispose();
    }
  });
  scene.remove(world);
  world = new THREE.Group();
  scene.add(world);
  
  // Освещение комнат
  addLight(-5, 1.5, 0, 0xffaa66, 15);   // Kitchen
  addLight(5, 1.5, 0, 0xffaa66, 15);    // Living
  addLight(0, 1.5, -6, 0xffaa66, 15);   // Study
  addLight(0, 1.5, 6, 0xffaa66, 15);    // Bedroom
  addLight(0, 1.5, 0, 0xffcc88, 12);    // Hallway
  
  // Полы (по комнатам)
  buildFloor(-3.2, 3.2, -9.2, -3.2);   // Study
  buildFloor(-2.2, 2.2, -3.2, 3.2);    // Hallway
  buildFloor(2.2, 8.2, -3.2, 3.2);     // Living
  buildFloor(-8.2, -2.2, -3.2, 3.2);   // Kitchen
  buildFloor(-3.2, 3.2, 3.2, 9.2);     // Bedroom
  
  // Стены
  WALLS.forEach(w => buildWall(w));
  
  // Потолок
  const ceilMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 1 });
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(17, 19), ceilMat);
  ceil.rotation.x = Math.PI/2;
  ceil.position.y = 3.2;
  world.add(ceil);
  
  // Окна в комнатах
  buildWindow(0, 1.8, -9.3, 2.5, 1.8, 'north');
  buildWindow(8.3, 1.8, 0, 2.5, 1.8, 'east');
  buildWindow(-8.3, 1.8, 0, 2.5, 1.8, 'west');
  buildWindow(0, 1.8, 9.3, 2.5, 1.8, 'south');
  
  // Мебель
  furnitureObjects.length = 0;
  FURNITURE.forEach(f => buildFurniture(f));
}

function addLight(x, y, z, color, intensity) {
  const l = new THREE.PointLight(color, intensity, 8, 1.5);
  l.position.set(x, y + 1.8, z);
  l.castShadow = true;
  l.shadow.mapSize.set(512, 512);
  world.add(l);
}

function buildFloor(x1, x2, z1, z2) {
  const w = x2 - x1, d = z2 - z1;
  const tex = TEX_FLOOR.clone();
  tex.repeat.set(w/2, d/2);
  tex.needsUpdate = true;
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9, metalness: 0.05 });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  mesh.rotation.x = -Math.PI/2;
  mesh.position.set((x1+x2)/2, 0, (z1+z2)/2);
  mesh.receiveShadow = true;
  world.add(mesh);
}

function buildWall(w) {
  const width = w.x2 - w.x1;
  const depth = w.z2 - w.z1;
  const mat = new THREE.MeshStandardMaterial({ map: TEX_WALL, roughness: 0.95, metalness: 0.02 });
  const tex = TEX_WALL.clone();
  tex.repeat.set(Math.max(1, width/2), 1.6);
  tex.needsUpdate = true;
  mat.map = tex;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, 3.2, depth), mat);
  mesh.position.set((w.x1+w.x2)/2, 1.6, (w.z1+w.z2)/2);
  mesh.receiveShadow = true;
  mesh.castShadow = true;
  world.add(mesh);
}

function buildWindow(x, y, z, w, h, dir) {
  const mat = new THREE.MeshStandardMaterial({
    color: 0x2a3a50, emissive: 0x4a6a9a, emissiveIntensity: 0.8,
    roughness: 0.3, metalness: 0.1
  });
  const geo = new THREE.PlaneGeometry(w, h);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  if (dir === 'north') mesh.rotation.y = 0;
  else if (dir === 'south') mesh.rotation.y = Math.PI;
  else if (dir === 'east') mesh.rotation.y = -Math.PI/2;
  else if (dir === 'west') mesh.rotation.y = Math.PI/2;
  world.add(mesh);
  // Свет от окна
  const l = new THREE.PointLight(0x88aaff, 6, 6, 2);
  l.position.set(x + (dir==='east'?-0.5:dir==='west'?0.5:0), y, z + (dir==='north'?0.5:dir==='south'?-0.5:0));
  world.add(l);
}

function buildFurniture(f) {
  const mat = new THREE.MeshStandardMaterial({
    map: f.type === 'sofa' || f.type === 'bed' ? TEX_CLOTH : TEX_WOOD,
    roughness: 0.85, metalness: 0.05,
    color: f.type === 'fridge' ? 0xc0c0c0 : f.type === 'tv' ? 0x222222 : 0xffffff
  });
  const geo = new THREE.BoxGeometry(f.size[0], f.size[1], f.size[2]);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(f.pos[0], f.pos[1], f.pos[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData = { furniture: f, type: 'furniture' };
  world.add(mesh);
  furnitureObjects.push({ mesh, data: f });
}

/* ================================================================
   12. УЛИКИ В СЦЕНЕ
   ================================================================ */
function spawnAllEvidence() {
  evidenceObjects = [];
  gameState.caseData.evidence.forEach(ev => {
    if (ev.found) return;
    
    const group = new THREE.Group();
    group.position.set(ev.pos[0], ev.pos[1], ev.pos[2]);
    
    // Базовый визуал (простой предмет)
    let baseGeo, baseMat;
    if (ev.tool === 'uv') {
      baseGeo = new THREE.CircleGeometry(0.12, 16);
      baseMat = new THREE.MeshStandardMaterial({
        color: 0x300010, roughness: 0.9, transparent: true, opacity: 0.4
      });
      const disc = new THREE.Mesh(baseGeo, baseMat);
      disc.rotation.x = -Math.PI/2;
      disc.position.y = 0.01;
      group.add(disc);
    } else if (ev.tool === 'magnifier') {
      baseGeo = new THREE.SphereGeometry(0.04, 8, 8);
      baseMat = new THREE.MeshStandardMaterial({
        color: 0x604020, roughness: 0.7, transparent: true, opacity: 0.5
      });
      group.add(new THREE.Mesh(baseGeo, baseMat));
    } else {
      baseGeo = new THREE.BoxGeometry(0.2, 0.03, 0.25);
      baseMat = new THREE.MeshStandardMaterial({
        color: 0xd8d0bc, roughness: 0.85, transparent: true, opacity: 0.6
      });
      group.add(new THREE.Mesh(baseGeo, baseMat));
    }
    
    // Спрайт-иконка (появляется при правильном инструменте)
    const iconMat = new THREE.SpriteMaterial({
      map: ev.tool === 'eyes' ? ICON_EYES : ev.tool === 'magnifier' ? ICON_MAG : ICON_UV,
      transparent: true, opacity: 0, depthTest: false
    });
    const sprite = new THREE.Sprite(iconMat);
    sprite.scale.set(0.3, 0.3, 1);
    sprite.position.y = 0.3;
    group.add(sprite);
    
    // Свет
    const light = new THREE.PointLight(
      ev.tool === 'uv' ? 0x8a50ff : ev.tool === 'magnifier' ? 0xffaa44 : 0xffffff,
      0, 1.5, 2
    );
    group.add(light);
    
    group.userData = { evidence: ev, type: 'evidence' };
    world.add(group);
    evidenceObjects.push({ group, data: ev, sprite, light });
  });
}

/* ================================================================
   13. ВЗАИМОДЕЙСТВИЕ
   ================================================================ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2(0, 0);
let hovered = null;

function updateInteraction() {
  if (gameState.phase !== 'scene') { hovered = null; return; }
  
  raycaster.setFromCamera(ndc, camera);
  const allMeshes = [
    ...evidenceObjects.map(e => e.group),
    ...furnitureObjects.map(f => f.mesh)
  ];
  
  const hits = raycaster.intersectObjects(allMeshes, true);
  hovered = null;
  
  if (hits.length > 0) {
    let obj = hits[0].object;
    // Найти корневой объект группы
    while (obj.parent && obj.parent !== world) obj = obj.parent;
    if (obj.userData.type === 'evidence') {
      hovered = obj;
    } else if (obj.userData.type === 'furniture') {
      hovered = obj;
    }
  }
  
  const pr = $('prompt');
  if (!hovered) { pr.classList.remove('on'); return; }
  
  const dist = camera.position.distanceTo(hovered.position);
  if (dist > 3.5) { pr.classList.remove('on'); return; }
  
  if (hovered.userData.type === 'evidence') {
    const ev = hovered.userData.evidence;
    if (ev.tool !== gameState.tool) {
      const names = { eyes:'осмотр', magnifier:'лупу', uv:'УФ-лампу' };
      pr.textContent = `Требуется ${names[ev.tool]}`;
    } else {
      pr.textContent = `ЛКМ: изъять — ${ev.name}`;
    }
    pr.classList.add('on');
  } else if (hovered.userData.type === 'furniture') {
    const f = hovered.userData.furniture;
    if (!f.openable) {
      pr.textContent = f.name;
    } else if (openedFurniture.has(f.id)) {
      pr.textContent = `Закрыть ${f.name}`;
    } else {
      pr.textContent = `ЛКМ: открыть ${f.name}`;
    }
    pr.classList.add('on');
  }
  
  // Обновить визуал улик
  updateEvidenceVisuals();
}

function updateEvidenceVisuals() {
  const now = performance.now() / 1000;
  evidenceObjects.forEach(eo => {
    const ev = eo.data;
    if (ev.found) { eo.group.visible = false; return; }
    
    const dist = camera.position.distanceTo(eo.group.position);
    const isNear = dist < 4;
    const isRightTool = ev.tool === gameState.tool;
    
    // Проверка на скрытость в закрытой мебели
    let hidden = false;
    if (ev.furniture) {
      const furn = FURNITURE.find(f => f.id === ev.furniture);
      if (furn && furn.openable && !openedFurniture.has(furn.id)) hidden = true;
    }
    
    if (hidden) {
      eo.group.visible = false;
    } else {
      eo.group.visible = true;
      // Пульсация иконки
      if (isNear && isRightTool) {
        eo.sprite.material.opacity = 0.7 + Math.sin(now*3) * 0.3;
        eo.light.intensity = 1.2 + Math.sin(now*2) * 0.4;
      } else {
        eo.sprite.material.opacity = 0;
        eo.light.intensity = 0;
      }
    }
  });
}

function interact(target) {
  if (!target) return;
  
  if (target.userData.type === 'evidence') {
    const ev = target.userData.evidence;
    if (ev.tool !== gameState.tool) {
      toast('Нужен другой инструмент');
      return;
    }
    collectEvidence(ev);
  } else if (target.userData.type === 'furniture') {
    const f = target.userData.furniture;
    if (!f.openable) return;
    
    if (openedFurniture.has(f.id)) {
      openedFurniture.delete(f.id);
      target.material.color.setHex(0xffffff);
      toast('Закрыто: ' + f.name);
    } else {
      openedFurniture.add(f.id);
      target.material.color.setHex(0x8a7040);
      toast('Открыто: ' + f.name);
    }
    updateEvidenceVisuals();
  }
}

function collectEvidence(ev) {
  ev.found = true;
  gameState.collected.push(ev);
  toast('Изъято: ' + ev.name);
  updateEvidenceHUD();
  updateEvidenceVisuals();
  
  const total = gameState.caseData.evidence.length;
  if (gameState.collected.length >= total) {
    setTimeout(() => {
      toast('Все улики собраны. Переход к допросу...');
      setTimeout(openInterrogation, 1800);
    }, 800);
  }
}

function updateEvidenceHUD() {
  const list = $('evlist');
  if (gameState.collected.length === 0) {
    list.innerHTML = '<div class="ev-empty">Улик пока нет</div>';
    return;
  }
  list.innerHTML = '';
  gameState.collected.forEach(ev => {
    const div = document.createElement('div');
    div.className = 'ev-item';
    div.innerHTML = `<span class="dot">◆</span><span>${ev.name}</span>`;
    list.appendChild(div);
  });
}

function setTool(tool) {
  gameState.tool = tool;
  document.querySelectorAll('.tool').forEach(t => {
    t.classList.toggle('active', t.dataset.tool === tool);
  });
  // УФ-режим темнит сцену
  if (tool === 'uv') {
    scene.background.setHex(0x050210);
    ambient.intensity = 0.3;
    hemi.intensity = 0.3;
    renderer.toneMappingExposure = 0.75;
  } else {
    scene.background.setHex(0x050508);
    ambient.intensity = 0.6;
    hemi.intensity = 0.7;
    renderer.toneMappingExposure = 1.1;
  }
  updateEvidenceVisuals();
}

function showRoomLabel(room) {
  const el = $('room-label');
  el.textContent = room;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2400);
}

/* ================================================================
   14. КАТСЦЕНА
   ================================================================ */
async function showCutscene(year, text, sub) {
  const cs = $('cutscene');
  $('cs-year').textContent = year;
  $('cs-text').textContent = text;
  $('cs-sub').textContent = sub || '';
  cs.classList.add('on');
  await sleep(3600);
  cs.classList.remove('on');
  await sleep(800);
}

/* ================================================================
   15. КАМЕРА И ДВИЖЕНИЕ
   ================================================================ */
function updateCamera() {
  camera.position.copy(player.pos);
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
}

function updateMovement(dt) {
  if (gameState.phase !== 'scene' || !locked) return;
  
  const speed = 2.8 * dt;
  const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  
  let dx = 0, dz = 0;
  if (keys['w'] || keys['arrowup'])    { dx += fwd.x; dz += fwd.z; }
  if (keys['s'] || keys['arrowdown'])  { dx -= fwd.x; dz -= fwd.z; }
  if (keys['a'] || keys['arrowleft'])  { dx -= right.x; dz -= right.z; }
  if (keys['d'] || keys['arrowright']) { dx += right.x; dz += right.z; }
  
  const len = Math.hypot(dx, dz);
  if (len > 0) {
    dx = dx / len * speed;
    dz = dz / len * speed;
    
    // Проверка по X
    if (canMoveTo(player.pos.x + dx, player.pos.z)) {
      player.pos.x += dx;
    }
    // Проверка по Z
    if (canMoveTo(player.pos.x, player.pos.z + dz)) {
      player.pos.z += dz;
    }
  }
  
  const room = getRoomAt(player.pos.x, player.pos.z);
  if (room !== gameState.currentRoom) {
    gameState.currentRoom = room;
    showRoomLabel(room);
  }
}

/* ================================================================
   16. ДОПРОС
   ================================================================ */
function openInterrogation() {
  gameState.phase = 'inter';
  document.exitPointerLock();
  $('hud').classList.remove('on');
  $('toolbar').classList.remove('on');
  $('crosshair').classList.remove('on');
  $('click-start').classList.remove('on');
  $('scr-inter').classList.add('on');
  renderInterrogation();
}

const QUESTIONS = [
  'Где вы находились в момент преступления?',
  'Вы были знакомы с потерпевшим?',
  'Что вы можете сказать об этом предмете?'
];

function renderInterrogation() {
  const grid = $('inter-grid');
  grid.innerHTML = '';
  gameState.caseData.suspects.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'sus-card';
    if (s.confessed) div.classList.add('selected');
    
    let status = '<div class="status ok">Не допрошен</div>';
    if (s.confessed) status = '<div class="status conf">Признание</div>';
    else if (s.exposed) status = '<div class="status denied">Алиби опровергнуто</div>';
    
    div.innerHTML = `
      <div class="name">${s.name}</div>
      <div class="role">${s.role}</div>
      <div class="alibi">«${s.alibi}»</div>
      ${status}
    `;
    div.onclick = () => openDossier(i);
    grid.appendChild(div);
  });
}

function openDossier(idx) {
  const s = gameState.caseData.suspects[idx];
  const dossier = $('dossier');
  dossier.classList.add('on');
  $('dossier-name').textContent = s.name + ' — ' + s.role;
  $('dialog').innerHTML = '';
  
  const actions = $('dossier-actions');
  actions.innerHTML = '';
  
  QUESTIONS.forEach((q, qi) => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = q;
    btn.onclick = () => askQuestion(idx, qi);
    actions.appendChild(btn);
  });
}

function askQuestion(idx, qi) {
  const s = gameState.caseData.suspects[idx];
  const dialog = $('dialog');
  
  let answer, isLie = false;
  if (qi === 0) {
    answer = `«${s.alibi}».`;
  } else if (qi === 1) {
    answer = s.culprit ? '«Знал. Пересекались по работе.»' : '«Знал шапочно.»';
  } else {
    const linkedEv = gameState.collected.find(e => e.linksTo === idx);
    if (linkedEv) {
      if (s.culprit) {
        answer = `«${linkedEv.name}? Впервые слышу. Этого не может быть.»`;
        isLie = true;
      } else {
        answer = `«Ах это… Да, моё. Но к делу отношения не имеет.»`;
      }
    } else {
      answer = '«Мне нечего сказать.»';
    }
  }
  
  const qa = document.createElement('div');
  qa.className = 'qa';
  qa.innerHTML = `<div class="q">${QUESTIONS[qi]}</div>
                  <div class="a${isLie ? ' lie' : ''}">${answer}</div>`;
  dialog.appendChild(qa);
  dialog.scrollTop = dialog.scrollHeight;
  
  // Кнопка предъявления
  if (qi === 2) {
    const linkedEv = gameState.collected.find(e => e.linksTo === idx && !s.exposed);
    if (linkedEv) {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.style.background = 'linear-gradient(180deg,#d4ae35,#8b7019)';
      btn.style.color = '#050805';
      btn.textContent = `Предъявить: ${linkedEv.name}`;
      btn.onclick = () => presentEvidence(idx, linkedEv);
      $('dossier-actions').appendChild(btn);
    }
  }
}

function presentEvidence(idx, ev) {
  const s = gameState.caseData.suspects[idx];
  s.exposed = true;
  const dialog = $('dialog');
  const qa = document.createElement('div');
  qa.className = 'qa';
  
  if (s.culprit) {
    s.confessed = true;
    qa.innerHTML = `<div class="q">Предъявлена улика: ${ev.name}</div>
      <div class="a lie">«…» Долгая пауза. ${s.name} опускается на стул.
      «Хорошо. Это моё. Я был там. Но я не хотел — так вышло.»</div>`;
    toast('ПРИЗНАНИЕ ПОЛУЧЕНО', 3000);
  } else {
    qa.innerHTML = `<div class="q">Предъявлена улика: ${ev.name}</div>
      <div class="a">«Да, это моё. Но к убийству отношения не имею.»</div>`;
    toast('Алиби опровергнуто');
  }
  dialog.appendChild(qa);
  dialog.scrollTop = dialog.scrollHeight;
  renderInterrogation();
}

$('btn-to-court').onclick = () => {
  gameState.phase = 'court';
  $('scr-inter').classList.remove('on');
  $('scr-court').classList.add('on');
  renderCourt();
};

/* ================================================================
   17. СУД
   ================================================================ */
let courtSuspect = null;
let courtEvidence = null;

function renderCourt() {
  const sg = $('court-grid');
  sg.innerHTML = '';
  gameState.caseData.suspects.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'court-item';
    div.innerHTML = `<b>${s.name}</b><br><small style="color:#8a8272">${s.role}</small>`;
    div.onclick = () => {
      courtSuspect = i;
      sg.querySelectorAll('.court-item').forEach(x => x.classList.remove('sel'));
      div.classList.add('sel');
      checkVerdictReady();
    };
    sg.appendChild(div);
  });
  
  const eg = $('court-ev-grid');
  eg.innerHTML = '';
  gameState.collected.forEach(ev => {
    const div = document.createElement('div');
    div.className = 'court-item';
    div.textContent = ev.name;
    div.onclick = () => {
      courtEvidence = ev;
      eg.querySelectorAll('.court-item').forEach(x => x.classList.remove('sel'));
      div.classList.add('sel');
      checkVerdictReady();
    };
    eg.appendChild(div);
  });
}

function checkVerdictReady() {
  $('btn-verdict').disabled = !(courtSuspect !== null && courtEvidence !== null);
}

$('btn-verdict').onclick = () => {
  const d = gameState.caseData;
  const s = d.suspects[courtSuspect];
  const culpritIdx = d.suspects.findIndex(x => x.culprit);
  const correctSuspect = courtSuspect === culpritIdx;
  const correctEvidence = courtEvidence.linksTo === culpritIdx;
  
  let title, text;
  if (correctSuspect && correctEvidence && s.confessed) {
    title = 'Виновен. Дело закрыто.';
    text = `Суд признал ${s.name} виновным. Признание, полученное на допросе, подкреплено ключевой уликой — «${courtEvidence.name}». Цепочка доказательств выстроена безупречно.`;
  } else if (correctSuspect && correctEvidence) {
    title = 'Виновен — но без признания.';
    text = `Суд признал ${s.name} виновным по совокупности улик. Однако на допросе признание так и не было получено — защита настаивает на недопустимости части доказательств.`;
  } else if (correctSuspect) {
    title = 'Виновный назван. Улика — нет.';
    text = `${s.name} действительно виновен. Но предъявленная улика «${courtEvidence.name}» не является ключевой. Суд оправдал обвиняемого. Настоящая улика — «${d.evidence.find(e => e.linksTo === culpritIdx)?.name || '—'}».`;
  } else {
    title = 'Осуждён невиновный.';
    text = `Суд признал виновным ${s.name}. Но настоящий преступник — ${d.suspects[culpritIdx].name}. Следствие велось в неверном направлении, и правосудие совершило ошибку.`;
  }
  
  const content = $('verdict-content');
  let histHtml = '';
  if (d.history) {
    histHtml = `<div class="history"><strong>Историческая справка</strong>${d.history}</div>`;
  }
  
  content.innerHTML = `<h2>${title}</h2><p>${text}</p>${histHtml}`;
  $('scr-court').classList.remove('on');
  $('scr-verdict').classList.add('on');
  gameState.phase = 'verdict';
};

$('btn-again').onclick = () => {
  $('scr-verdict').classList.remove('on');
  $('scr-menu').classList.add('on');
  initMenu();
  gameState.phase = 'menu';
  courtSuspect = null;
  courtEvidence = null;
};

/* ================================================================
   18. МАГАЗИН ТОВАРОВ / КЛИК НА КНОПКУ
   ================================================================ */
document.querySelectorAll('.tool').forEach(t => {
  t.onclick = () => setTool(t.dataset.tool);
});
$('click-start').onclick = () => {
  renderer.domElement.requestPointerLock();
  $('click-start').classList.remove('on');
};

renderer.domElement.addEventListener('mousedown', e => {
  if (gameState.phase !== 'scene' || !locked) return;
  if (hovered) interact(hovered);
});

/* ================================================================
   19. ГЛАВНЫЙ ЦИКЛ
   ================================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  
  updateMovement(dt);
  updateCamera();
  updateInteraction();
  
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

initMenu();
animate();

// Начальная сцена — пустая тёмная комната (для фона меню)
buildApartment();
</script>
